<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer></script>
    <script type="module" src="script.js" defer></script>
    <script
      src="https://kit.fontawesome.com/14273d579a.js"
      crossorigin="anonymous"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" />
    <title>To do</title>
  </head>
  <body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-start mt-5">
      <div class="container" id="js-list-container">
        <!-- Filters -->
        <nav class="row ">
          <div class="col"></div>
          <div class="col-3 col-md-2 col-xxl-1 p-0 d-flex align-items-end" ><button type="button" class="js-selected btn btn-dark w-100 rounded-top-4 rounded-bottom-0 border border-secondary border-bottom-0 py-2">All</button></div>
          <div class="col-3 col-md-2 col-xxl-1 p-0 d-flex align-items-end" ><button type="button"  class="btn btn-warning w-100 rounded-top-4 rounded-bottom-0 border border-secondary border-bottom-0 ">Active</button></div>
          <div class="col-3 col-md-2 col-xxl-1 p-0 d-flex align-items-end" ><button type="button" class="btn btn-success w-100 rounded-top-4 rounded-bottom-0 border border-secondary border-bottom-0">Completed</button></div>
        </nav>

        <!-- Enter new row -->
        <div class="row border border-black rounded-top-4 rounded-end-0 overflow-hidden">
          <div class="col-2 p-0 bg-primary"></div>
          <div class="col py-2 px-0 bg-primary d-flex justify-content-center align-items-center" ><input type="text" id="js-user-input" class="w-100 rounded-3 border-0"></div>
          <div class="col-1 p-0 bg-primary"></div>
          <div class="col-4 col-lg-2 p-0" ><button type="button" id="js-add-btn" class="btn btn-info border-0 border-start border-1 border-black w-100 h-100 rounded-0">Add</button></div>
        </div>

        <!-- List Rows -->

      </div>
    </div>
  </body>
</html>
